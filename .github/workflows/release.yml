name: Release AutoPrint

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PUBLIC_RELEASE_REPO: naskek/AutoPrint-GUI-Releases
  PUBLIC_RELEASE_TOKEN: ${{ secrets.AUTOPRINT_RELEASE_TOKEN }}

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Require tagged commit to be contained in main
        shell: pwsh
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release blocked: tagged commit $env:GITHUB_SHA is not contained in origin/main. Merge it into main before tagging or publishing."
          }

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build_tools/requirements.txt

      - name: Validate tag matches application version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag.StartsWith("v")) { throw "Release tag must start with v" }
          $tagVersion = $tag.Substring(1)
          $appVersion = python -c "from app_version import APP_VERSION; print(APP_VERSION)"
          if ($tagVersion -ne $appVersion) {
            throw "Tag version $tagVersion does not match app_version.py $appVersion"
          }
          "APP_VERSION=$appVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r build_tools/requirements.txt

      - name: Validate Python sources and unit/regression tests
        shell: pwsh
        run: |
          python -m py_compile app_version.py updater.py autoprint_main.py bartender_com.py build_tools/build_exe.py tests/test_updater.py
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run BarTender COM contract tests
        timeout-minutes: 10
        shell: pwsh
        run: |
          python -m py_compile tests/contract_bartender_com.py tools/bartender_live_smoke.py
          python -m unittest discover -s tests -p "contract_*.py" -v

      - name: Build PyInstaller application
        shell: pwsh
        run: python build_tools/build_exe.py

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc "build_tools\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Resolve installer
        shell: pwsh
        run: |
          $installer = "dist\installer\AutoPrint_Setup_$env:APP_VERSION.exe"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          # AutoPrint 3.2.1 and older only recognize the legacy filename. Keep this
          # byte-identical alias until compatibility with those updaters is intentionally dropped.
          $legacyInstaller = "dist\installer\BarTenderGUI_Setup_$env:APP_VERSION.exe"
          Copy-Item -LiteralPath $installer -Destination $legacyInstaller -Force
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          $legacyHash = (Get-FileHash $legacyInstaller -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($legacyHash -ne $hash) { throw "Legacy installer alias is not byte-identical" }
          "INSTALLER_PATH=$installer" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "LEGACY_INSTALLER_PATH=$legacyInstaller" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "INSTALLER_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Installer SHA256: $hash"

      - name: Publish private source release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = @"
          AutoPrint $env:APP_VERSION

          SHA-256: $env:INSTALLER_SHA256
          "@
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:INSTALLER_PATH $env:LEGACY_INSTALLER_PATH --repo $env:GITHUB_REPOSITORY --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create $tag $env:INSTALLER_PATH $env:LEGACY_INSTALLER_PATH --repo $env:GITHUB_REPOSITORY --title "AutoPrint $env:APP_VERSION" --notes $notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Require public updater channel credentials
        if: env.PUBLIC_RELEASE_TOKEN == ''
        shell: pwsh
        run: |
          throw "Production release blocked: AUTOPRINT_RELEASE_TOKEN is required to publish the public updater channel."

      - name: Publish public updater release
        env:
          GH_TOKEN: ${{ secrets.AUTOPRINT_RELEASE_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $notes = @"
          AutoPrint $env:APP_VERSION

          Compiled update package. Source code is stored separately in the private AutoPrint-GUI repository.
          SHA-256: $env:INSTALLER_SHA256
          "@
          gh release view $tag --repo $env:PUBLIC_RELEASE_REPO *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $env:INSTALLER_PATH $env:LEGACY_INSTALLER_PATH --repo $env:PUBLIC_RELEASE_REPO --clobber
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            gh release create $tag $env:INSTALLER_PATH $env:LEGACY_INSTALLER_PATH --repo $env:PUBLIC_RELEASE_REPO --title "AutoPrint $env:APP_VERSION" --notes $notes
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Verify public updater release
        env:
          GH_TOKEN: ${{ secrets.AUTOPRINT_RELEASE_TOKEN }}
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $expectedCurrent = "AutoPrint_Setup_$env:APP_VERSION.exe"
          $expectedLegacy = "BarTenderGUI_Setup_$env:APP_VERSION.exe"

          $releaseJson = gh api "repos/$env:PUBLIC_RELEASE_REPO/releases/tags/$tag"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $release = $releaseJson | ConvertFrom-Json

          if ([string]$release.tag_name -ne $tag) {
            throw "Public updater release tag mismatch: expected $tag, got $($release.tag_name)"
          }

          $assets = @($release.assets)
          $current = $assets | Where-Object { $_.name -eq $expectedCurrent } | Select-Object -First 1
          $legacy = $assets | Where-Object { $_.name -eq $expectedLegacy } | Select-Object -First 1

          if (-not $current) { throw "Public updater release is missing $expectedCurrent" }
          if (-not $legacy) { throw "Public updater release is missing $expectedLegacy" }

          foreach ($asset in @($current, $legacy)) {
            $digest = [string]$asset.digest
            if (-not $digest.StartsWith("sha256:")) {
              throw "Public updater asset $($asset.name) has no SHA-256 digest"
            }
            $publishedHash = $digest.Substring(7).ToLowerInvariant()
            if ($publishedHash -ne $env:INSTALLER_SHA256) {
              throw "Public updater asset $($asset.name) digest does not match built installer"
            }
          }

          Write-Host "Public updater release verified: $tag"
