name: Build AutoPrint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build_tools/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r build_tools/requirements.txt

      - name: Validate Python sources and tests
        shell: pwsh
        run: |
          python -m py_compile app_version.py updater.py autoprint_main.py build_tools/build_exe.py tests/test_updater.py
          python -m unittest discover -s tests -v

      - name: Build PyInstaller application
        shell: pwsh
        run: python build_tools/build_exe.py

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc "build_tools\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer
        shell: pwsh
        run: |
          $version = python -c "from app_version import APP_VERSION; print(APP_VERSION)"
          $installer = "dist\installer\BarTenderGUI_Setup_${version}.exe"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          Get-Item $installer | Select-Object Name, Length, LastWriteTime
          Get-FileHash $installer -Algorithm SHA256

      - name: Upload installer artifact
        uses: actions/upload-artifact@v6
        with:
          name: AutoPrint-Windows-Installer
          path: dist/installer/BarTenderGUI_Setup_*.exe
          if-no-files-found: error
          retention-days: 14
