name: Build AutoPrint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-regression-tests:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build_tools/requirements.txt

      - name: Install test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r build_tools/requirements.txt

      - name: Validate Python sources
        shell: pwsh
        run: |
          python -m py_compile app_version.py updater.py autoprint_main.py bartender_com.py build_tools/build_exe.py tests/test_updater.py

      - name: Run unit and regression tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py" -v

  bartender-com-contract:
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build_tools/requirements.txt

      - name: Install contract-test dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r build_tools/requirements.txt

      - name: Validate BarTender contract harness
        shell: pwsh
        run: python -m py_compile bartender_com.py tests/contract_bartender_com.py tools/bartender_live_smoke.py

      - name: Run BarTender COM contract tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "contract_*.py" -v

  build-windows:
    needs: [unit-regression-tests, bartender-com-contract]
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build_tools/requirements.txt

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r build_tools/requirements.txt

      - name: Build PyInstaller application
        shell: pwsh
        run: python build_tools/build_exe.py

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $candidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup --no-progress -y
            $iscc = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc "build_tools\installer.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify installer
        shell: pwsh
        run: |
          $version = python -c "from app_version import APP_VERSION; print(APP_VERSION)"
          $installer = "dist\installer\AutoPrint_Setup_${version}.exe"
          if (-not (Test-Path $installer)) { throw "Installer not found: $installer" }
          Get-Item $installer | Select-Object Name, Length, LastWriteTime
          Get-FileHash $installer -Algorithm SHA256

      - name: Packaged BTW preservation smoke
        shell: pwsh
        run: |
          $version = python -c "from app_version import APP_VERSION; print(APP_VERSION)"
          $env:AUTOPRINT_SMOKE_EXPECT_SHA = "${{ github.event.pull_request.head.sha || github.sha }}"
          ./tools/packaged_template_smoke.ps1 -Installer "dist/installer/AutoPrint_Setup_${version}.exe"

      - name: Save candidate installer for isolated data migration job
        uses: actions/upload-artifact@v6
        with:
          name: AutoPrint-Release68-Isolated-Candidate
          path: dist/installer/AutoPrint_Setup_*.exe
          if-no-files-found: error
          retention-days: 1

      - name: Upload packaged smoke logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: AutoPrint-Packaged-Smoke-Logs
          path: ${{ runner.temp }}/autoprint-btw-smoke-*/*.log
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload installer artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v6
        with:
          name: AutoPrint-Windows-Installer
          path: dist/installer/AutoPrint_Setup_*.exe
          if-no-files-found: error
          retention-days: 3

  packaged-data-migration-smoke:
    needs: [build-windows]
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact integration candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: build_tools/requirements.txt

      - name: Install migration-test dependencies
        shell: pwsh
        run: |
          python -m pip install -r build_tools/requirements.txt

      - name: Download built candidate installer to disposable runner
        uses: actions/download-artifact@v6
        with:
          name: AutoPrint-Release68-Isolated-Candidate
          path: dist/installer

      - name: Download and hash-verify published 3.2.4 installer
        shell: pwsh
        run: |
          $publishedUrl = "https://github.com/naskek/AutoPrint-GUI-Releases/releases/download/v3.2.4/AutoPrint_Setup_3.2.4.exe"
          $publishedInstaller = Join-Path $env:RUNNER_TEMP 'AutoPrint_Setup_public-v3.2.4.exe'
          $expectedHash = 'bf69876759b3a8d356d8fe26494b7a13bb2bd2f9e92dd6e56dfa3ba16087c168'
          Invoke-WebRequest -Uri $publishedUrl -OutFile $publishedInstaller -MaximumRedirection 10 -ErrorAction Stop
          if (-not (Test-Path -LiteralPath $publishedInstaller)) { throw 'Missing public 3.2.4 installer' }
          $actualHash = (Get-FileHash -LiteralPath $publishedInstaller -Algorithm SHA256).Hash
          if ($actualHash -ne $expectedHash) {
            throw "Published 3.2.4 checksum mismatch, expected $expectedHash got $actualHash"
          }
          "PRODUCTION_324_INSTALLER=$publishedInstaller" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "PASS: actual publicly released v3.2.4 installer SHA-256 verified"

      - name: Verify exact SHA and run public-installer upgrade smoke
        shell: pwsh
        run: |
          $version = python -c "from app_version import APP_VERSION; print(APP_VERSION)"
          $env:AUTOPRINT_SMOKE_EXPECT_SHA = "${{ github.event.pull_request.head.sha || github.sha }}"
          ./tools/release68_data_smoke.ps1 -Installer "dist/installer/AutoPrint_Setup_${version}.exe" `
            -ProductionInstaller $env:PRODUCTION_324_INSTALLER `
            -ProductionSha256 'bf69876759b3a8d356d8fe26494b7a13bb2bd2f9e92dd6e56dfa3ba16087c168'

      - name: Save isolated migration logs on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: AutoPrint-Release68-Data-Smoke-Logs
          path: ${{ runner.temp }}/autoprint-68-data-*/*.log
          if-no-files-found: ignore
          retention-days: 1
